# AI服务配置
ai:
  api_key: "YOUR_API_KEY"  # 替换为你的API Key
  endpoint: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation"
  model: "qwen-turbo"
  temperature: 0.7
  top_p: 0.8
  max_tokens: 2000

# 数据库配置
postgres:
  host: 101.126.17.221
  port: 25432
  user: YOUR_DB_USER
  password: YOUR_DB_PASSWORD
  dbname: robot_any
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# Redis配置
redis:
  # 单Redis配置（向后兼容）
  host: 101.126.17.221
  port: 36379
  password: "YOUR_REDIS_PASSWORD"
  db: 0
  pool_size: 100
  min_idle_conns: 10
  
  # 多Redis集群配置
  clusters:
    - name: "some_cache_1"  # 用户数据缓存
      host: 101.126.17.221
      port: 36379
      password: "YOUR_REDIS_PASSWORD"
      db: 0
      pool_size: 50
      min_idle_conns: 5
    - name: "some_cache_2"  # 业务数据缓存
      host: 101.126.17.221
      port: 36379
      password: "YOUR_REDIS_PASSWORD"
      db: 1
      pool_size: 50
      min_idle_conns: 5
    - name: "some_cache_3"  # 会话缓存
      host: 101.126.17.221
      port: 36379
      password: "YOUR_REDIS_PASSWORD"
      db: 2
      pool_size: 30
      min_idle_conns: 3
  
  # 缓存降级配置
  fallback:
    enabled: false           # 是否启用降级
    local_cache_size: 100   # 本地缓存大小(MB)
    retry_interval: 30      # Redis故障后重试间隔(秒)

# 华为云OBS配置
huaweicloud_obs:
  endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
  access_key: "YOUR_OBS_ACCESS_KEY"
  secret_key: "YOUR_OBS_SECRET_KEY"
  bucket_name: "danfwing"
  path: "robot_any"

minio:
  endpoint: yourEndpoint
  access_key_id: yourAccessKeyId
  access_key_secret: yourAccessKeySecret
  bucket_name: yourBucketName
  use_ssl: false
  base_path:
  bucket_url: http://host:9000/yourBucketName

local:
  path: "uploads/file"
  store_path: "uploads/file"

# Web服务配置
web:
  port: 28091
  read_timeout: 60
  write_timeout: 60
  max_header_bytes: 1048576

# TCP服务配置
tcp:
  port: 29088
  read_timeout: 300
  write_timeout: 300
  max_connections: 10000
  heartbeat_interval: 30
  heartbeat_timeout: 90
  secret_key: "YOUR_TCP_SECRET_KEY"
  tls:
    cert_file: "configs/server.crt"
    key_file: "configs/server.key"
    enabled: false

# 日志配置
log:
  level: "debug"
  filename: "logs/app.log"
  max_size: 100    # MB
  max_age: 30      # 天
  max_backups: 10  # 保留文件个数

system:
  db-type: "postgres"
  oss-type: "huawei"
  version: "v1.0.0"

gitee:
  client_id: "f8128f32179164c4136f92c9c7949488b6e4a516b3aad26ce12de35a1bb0ca82"
  client_secret: "YOUR_GITEE_CLIENT_SECRET"
  redirect_uri: "http://localhost:28091/api/v1.0/callback"
  scope: "user_info,projects"

nsq:
  nsqd: "101.126.17.221:24150"
  nsqlookupd:
    - "101.126.17.221:4161"
  topic: "screenshot.ingest"
  channel: "ai"
  dlq: "screenshot.dlq"
  workers: 8
  max_in_flight: 100
  max_attempts: 5
  msg_timeout: 5
  off: false

# RAG配置
rag:
  embedding:
    provider: infinity
    baseURL: http://107.149.143.39:38081
    apiKey: ""
    model: Alibaba-NLP/gte-multilingual-base
    endpointPath: /embeddings
    timeoutSeconds: 30
    dimensions: 768
    queryInstruction: ""
    documentInstruction: ""
  qdrant:
    baseURL: http://107.149.143.39:36333
    apiKey: ""
    collection: my_brain
    timeoutSeconds: 20
    topK: 5
    scoreThreshold: 0.0
